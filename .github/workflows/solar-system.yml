name: Solor System yaml

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/*

jobs:
    unit-tests:
        runs-on: ubuntu-latest
        steps: 
            - name: Checkout code
              uses: actions/checkout@v3

            - name: Set up Node.js
              uses: actions/setup-node@v6
              with:
                node-version: 20

            - name: Install dependencies
              run: npm install

            - name: Run tests
              run: npm test

            
              
