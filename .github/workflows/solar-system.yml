name: Solor System yaml

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/*


env:
  MONGO_URI: ${{ secrets.MONGO_URI }}

jobs:
  
    unit-tests:
        strategy:
          fail-fast: true
          max-parallel: 2
          matrix:
            os-version: [18, 20]
            os: [ubuntu-latest]
        runs-on: ${{ matrix.os }}
        steps: 
            - name: Checkout code
              uses: actions/checkout@v3

            - name: Set up Nodejs ${{ matrix.os-version }}
              uses: actions/setup-node@v6
              with:
                node-version: ${{ matrix.os-version }}

            
            - name: Cache node modules
              uses: actions/cache@v3
              with:
                path: node_modules
                key: ${{ runner.os }}-node-${{ matrix.os-version }}-${{ hashFiles('package-lock.json') }}


            - name: Install dependencies
              run: npm install

            - name: Run tests
              id: nodejs-unit-tests
              run: npm test

            - name: Upload test results
              if: always() 
              uses: actions/upload-artifact@v4
              with:
                name: mocha-test-result-${{ matrix.os }}-${{ matrix.os-version }}
                path: test-results.xml


            # always upload test results, even if the tests fail
            # always() is a special function that returns true, regardless of the outcome of the previous steps
            # sucess() would only upload the test results if the tests pass, which is not what we want in this case
            # failure() would only upload the test results if the tests fail, which is also not what we want in this case
            # steps.nodejs-unit-tests.outcome == 'failure' would only upload the test results if the tests fail, which is also not what we want in this case

    code-coverage:
        runs-on: ubuntu-latest
        needs: unit-tests
        steps:
            - name: Checkout code
              uses: actions/checkout@v3

            - name: Set up node js 
              uses: actions/setup-node@v6
              with:
                    node-version: 18


            - name: Cache node modules
              uses: actions/cache@v3
              with:
                path: node_modules
                key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}

            - name: Install dependencies
              run: npm install

            - name: Run code coverage
              continue-on-error: true
              run: npm run coverage
              
            - name: Upload code coverage report
              uses: actions/upload-artifact@v4
              with:
                name: code-coverage-report
                path: coverage
                retention-days: 5

    containerization:
        runs-on: ubuntu-latest
        needs: [unit-tests, code-coverage]
        permissions:
          contents: read
          packages: write
        steps:
            - name: Checkout code
              uses: actions/checkout@v3

            - name: Login to Docker Hub
              uses: docker/login-action@v4
              with:
                username: ${{ secrets.DOCKER_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN  }}

            - name: Login to GHCR 
              uses: docker/login-action@v4
              with:
                registry: ghcr.io
                username: ${{ github.repository_owner }}
                password: ${{ secrets.GITHUB_TOKEN }} 

            - name: Build Docker image
              uses: docker/build-push-action@v6
              with:
                context: .
                push: false
                tags: ${{ secrets.DOCKER_USERNAME }}/solar-system:${{ github.sha }}

            - name: Test Docker image
              run: |
                docker images 
                docker run -d -p 3000:3000 \
                --name solar-system-test \
                -e MONGO_URI=${{ secrets.MONGO_URI }} \
                ${{ secrets.DOCKER_USERNAME }}/solar-system:${{ github.sha }} 

                sleep 10 
                docker ps
                curl -f http://localhost:3000/live | grep "live" || exit 1

            - name: Container Registry Push
              uses: docker/build-push-action@v6
              with:
                context: .
                push: true
                tags: |
                  ${{ secrets.DOCKER_USERNAME }}/solar-system:${{ github.sha }}
                  ghcr.io/jhadevloper4035/solar-system:${{ github.sha }}

           
     

   

            
              
