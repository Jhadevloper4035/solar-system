name: Solor System yaml

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/*


env:
  MONGO_URI: ${{ secrets.MONGO_URI }}

jobs:

    unit-tests:
        strategy:
          fail-fast: true
          max-parallel: 2
          matrix:
            os-version: [18, 20]
            os: [ubuntu-latest , macos-latest]
            exclude:
              - os: macos-latest
                os-version: 18
        runs-on: ${{ matrix.os }}
        steps: 
            - name: Checkout code
              uses: actions/checkout@v3

            - name: Set up Nodejs ${{ matrix.os-version }}
              uses: actions/setup-node@v6
              with:
                node-version: ${{ matrix.os-version }}

            - name: Install dependencies
              run: npm install

            - name: Run tests
              id: nodejs-unit-tests
              run: npm test

            # always upload test results, even if the tests fail
            # always() is a special function that returns true, regardless of the outcome of the previous steps
            # sucess() would only upload the test results if the tests pass, which is not what we want in this case
            # failure() would only upload the test results if the tests fail, which is also not what we want in this case


            # steps.nodejs-unit-tests.outcome == 'failure' would only upload the test results if the tests fail, which is also not what we want in this case

            - name: Upload test results
              if: always() 
              uses: actions/upload-artifact@v4
              with:
                name: mocha-test-result-${{ matrix.os }}-${{ matrix.os-version }}
                path: test-results.xml

    code-coverage:
        runs-on: ubuntu-latest
        needs: unit-tests
        steps:
            - name: Checkout code
              uses: actions/checkout@v3

            - name: Set up node js 
              uses: actions/setup-node@v6
              with:
                    node-version: 18

            - name: Install dependencies
              run: npm install

            - name: Run code coverage
              continue-on-error: true
              run: npm run coverage

            - name: Upload code coverage report
              uses: actions/upload-artifact@v4
              with:
                name: code-coverage-report
                path: coverage
                retention-days: 5


            
              
